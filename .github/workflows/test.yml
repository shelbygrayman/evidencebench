name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test
      - uses: actions/checkout@v6
        with:
          repository: shelbygrayman/sourcekeep
          ref: ea45ee7459029f0306a4c82971d8a59291d6157b
          path: sourcekeep-checkout
      - run: node --test sourcekeep-eval.test.mjs
        env:
          SOURCEKEEP_DIR: sourcekeep-checkout
